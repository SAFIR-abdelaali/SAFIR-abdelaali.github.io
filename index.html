<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1b2a" />
    <title>Abdelaali Safir - Portfolio</title>
    <!--head-meta-->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d1426'/%3E%3Ccircle cx='11' cy='12' r='3.2' fill='%23fbf5ea'/%3E%3Ccircle cx='22' cy='10' r='3.2' fill='%23d3b5ab'/%3E%3Ccircle cx='16' cy='23' r='3.2' fill='%23f3e9da'/%3E%3C/svg%3E"
    />
    <!-- Runs before first paint: theme, language redirect, and the "motion is coming" flag. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
        var t = get('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        d.setAttribute('data-theme', t);
        document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#f3e9da' : '#0d1b2a';
        var m = get('motion');
        d.setAttribute('data-motion', m === 'off' ? 'still' : m === 'on' ? 'full' : matchMedia('(prefers-reduced-motion: reduce)').matches ? 'calm' : 'full');
        if (location.pathname === '/') {
          var l = get('lang');
          if (!l) { var n = (navigator.language || '').slice(0, 2); if (n === 'fr' || n === 'ar') l = n; }
          if (l === 'fr' || l === 'ar') { location.replace('/' + l + '/' + location.search + location.hash); return; }
        }
      })();
    </script>
    <!-- Loader styles are inline and repeat the theme values: this paints before the stylesheet arrives. -->
    <style>
      .loader { display: none; }
      .js .loader {
        --l-bg: #0d1b2a; --l-accent: #e0e1dd; --l-soft: #778da9;
        display: grid; place-items: center; position: fixed; inset: 0; z-index: 1000; background: var(--l-bg);
      }
      [data-theme='light'] .loader { --l-bg: #f3e9da; --l-accent: #6d1426; --l-soft: #7b3a44; }
      .loader-ribbons { position: absolute; inset: 0; width: 100%; height: 100%; }
      .loader-ribbons path { fill: var(--l-bg); stroke: var(--l-accent); stroke-opacity: 0; stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
      .loader-icon { position: relative; display: grid; justify-items: center; gap: 12px; transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
      .loader-icon.is-out { opacity: 0; transform: scale(0.86); }
      .loader-icon svg { width: 124px; height: auto; overflow: visible; }
      .loader-pct { font: 600 13px/1 ui-monospace, Consolas, monospace; letter-spacing: 0.04em; color: var(--l-soft); }
      .l-lights circle { fill: var(--l-soft); }
      .l-lights circle:nth-child(odd) { animation: l-blink 1.3s ease-in-out infinite; }
      .l-lights circle:nth-child(3) { animation-delay: 0.3s; }
      .l-lights circle:nth-child(5) { animation-delay: 0.6s; }
      @keyframes l-blink { 50% { opacity: 0.25; } }
      .l-line { fill: none; stroke: var(--l-soft); stroke-width: 2.5; stroke-linecap: round; }
      .l-wave { fill: var(--l-accent); animation: l-wave 2.4s linear infinite; }
      .l-wave-back { opacity: 0.4; animation-duration: 3.4s; animation-direction: reverse; }
      .l-bit { fill: var(--l-soft); font: 600 11px ui-monospace, Consolas, monospace; text-anchor: middle; opacity: 0; animation: l-bit 2.1s ease-out infinite; }
      @keyframes l-wave { to { transform: translateX(-96px); } }
      @keyframes l-bit { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: 0.9; } 100% { opacity: 0; transform: translateY(-20px); } }
      html[data-motion='still'] .loader * { animation: none; transition: none; }
    </style>
  </head>
  <body>
    <div class="loader" id="loader" role="status" aria-label="Loading">
      <svg class="loader-ribbons" id="loader-ribbons" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="loader-icon" id="loader-icon">
        <svg viewBox="0 -18 96 130" aria-hidden="true">
          <defs>
            <clipPath id="l-tank"><path d="M12 16V96A36 10 0 0 0 84 96V16A36 10 0 0 0 12 16Z" /></clipPath>
          </defs>
          <text class="l-bit" x="30" y="-2">0</text>
          <text class="l-bit" x="48" y="-4" style="animation-delay: 0.7s">1</text>
          <text class="l-bit" x="66" y="-2" style="animation-delay: 1.4s">0</text>
          <g clip-path="url(#l-tank)">
            <g id="loader-level" transform="translate(0 110)">
              <path class="l-wave l-wave-back" d="M-96 0q12-6 24 0t24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0V130H-96Z" />
              <path class="l-wave" d="M-96 3q12 6 24 0t24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0 24 0V130H-96Z" />
            </g>
          </g>
          <ellipse class="l-line" cx="48" cy="16" rx="36" ry="10" />
          <path class="l-line" d="M12 16V96A36 10 0 0 0 84 96V16" />
          <path class="l-line" d="M12 43A36 10 0 0 0 84 43M12 70A36 10 0 0 0 84 70" />
          <g class="l-lights">
            <circle cx="24" cy="36" r="2.6" /><circle cx="33" cy="38" r="2.6" />
            <circle cx="24" cy="63" r="2.6" /><circle cx="33" cy="65" r="2.6" />
            <circle cx="24" cy="90" r="2.6" /><circle cx="33" cy="92" r="2.6" />
          </g>
        </svg>
        <span class="loader-pct" id="loader-pct" dir="ltr">0%</span>
      </div>
    </div>
    <script>
      // Fills a database icon with real load progress, then splits into wavy vertical ribbons that slide apart.
      (function () {
        var root = document.documentElement, el = document.getElementById('loader');
        if (!root.classList.contains('js')) return;
        root.classList.add('is-loading');
        el.setAttribute('aria-label', { fr: 'Chargement', ar: 'جارٍ التحميل' }[root.lang] || 'Loading');

        var svg = document.getElementById('loader-ribbons'), icon = document.getElementById('loader-icon');
        var level = document.getElementById('loader-level'), pct = document.getElementById('loader-pct');
        var block = function (e) { e.preventDefault(); e.stopPropagation(); };
        var opts = { capture: true, passive: false };
        addEventListener('wheel', block, opts);
        addEventListener('touchmove', block, opts);

        var seen = false;
        try { seen = !!sessionStorage.getItem('loaded'); sessionStorage.setItem('loaded', '1'); } catch (e) {}
        var minTime = seen ? 700 : 1700, maxTime = 7000;
        var loaded = document.readyState === 'complete', fontsDone = !document.fonts;
        addEventListener('load', function () { loaded = true; });
        if (document.fonts) document.fonts.ready.then(function () { fontsDone = true; });

        var uncover = function () {
          root.classList.remove('is-loading');
          removeEventListener('wheel', block, opts);
          removeEventListener('touchmove', block, opts);
          // If the app bundle still hasn't run, drop the hidden starting states so the page stays readable.
          if (!window.__booted) root.classList.remove('js');
          dispatchEvent(new Event('loader:done'));
        };

        var split = function () {
          var mode = root.dataset.motion;
          if (mode === 'still') { uncover(); el.remove(); return; }
          if (mode === 'calm') {
            uncover();
            el.style.transition = 'opacity 0.3s ease';
            el.style.opacity = '0';
            setTimeout(function () { el.remove(); }, 320);
            return;
          }

          var n = innerWidth < 640 ? 4 : 7, rtl = root.dir === 'rtl';
          var CRACK = 240, DUR = 980, STAGGER = 62, paths = [], i;
          for (i = 0; i < n; i++) {
            paths.push(document.createElementNS('http://www.w3.org/2000/svg', 'path'));
            svg.appendChild(paths[i]);
          }
          var seam = function (k, y, t, amp) {
            if (k === 0) return -3;
            if (k === n) return 103;
            return (k / n) * 100 + amp * (Math.sin(y * 0.11 + k * 1.9 + t * 0.0032) + 0.5 * Math.sin(y * 0.047 - t * 0.0021 + k));
          };
          var ease = function (x) { return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; };
          var t0 = performance.now(), shown = false;
          var total = CRACK + DUR + (n - 1) * STAGGER;
          var frame = function (now) {
            var t = now - t0;
            for (var r = 0; r < n; r++) {
              var order = rtl ? n - 1 - r : r;
              var p = Math.max(0, Math.min(1, (t - CRACK - order * STAGGER) / DUR));
              var amp = 1.1 + ease(p) * 1.6, d = '', y;
              for (y = -3; y <= 103; y += 1.5) d += (d ? 'L' : 'M') + seam(r, y, t, amp).toFixed(2) + ' ' + y;
              // the leading ends ripple too, so no ribbon finishes in a straight cut
              var a = seam(r, 103, t, amp), b = seam(r + 1, 103, t, amp), c = seam(r, -3, t, amp), e = seam(r + 1, -3, t, amp), j;
              for (j = 1; j < 48; j++) d += 'L' + (a + ((b - a) * j) / 48).toFixed(2) + ' ' + (106 + 2.6 * Math.sin(j * 0.26 + r * 2 + t * 0.004)).toFixed(2);
              for (y = 103; y >= -3; y -= 1.5) d += 'L' + seam(r + 1, y, t, amp).toFixed(2) + ' ' + y;
              for (j = 47; j > 0; j--) d += 'L' + (c + ((e - c) * j) / 48).toFixed(2) + ' ' + (-6 + 2.6 * Math.sin(j * 0.26 + r * 3 - t * 0.004)).toFixed(2);
              paths[r].setAttribute('d', d + 'Z');
              paths[r].setAttribute('transform', 'translate(0 ' + ((r % 2 ? 1 : -1) * 112 * ease(p)).toFixed(2) + ')');
              paths[r].style.strokeOpacity = Math.min(1, t / CRACK) * 0.75;
            }
            if (!shown) { shown = true; el.style.background = 'transparent'; icon.classList.add('is-out'); }
            if (root.classList.contains('is-loading') && t > CRACK + 220) uncover();
            if (t < total) requestAnimationFrame(frame);
            else el.remove();
          };
          requestAnimationFrame(frame);
        };

        var start = performance.now(), last = start, p = 0;
        var tick = function (now) {
          var elapsed = now - start, dt = (now - last) / 1000;
          last = now;
          var ready = (loaded && fontsDone && window.__booted) || elapsed > maxTime;
          var goal = Math.min(ready ? 1 : 0.92, elapsed / minTime);
          p += (goal - p) * (1 - Math.exp(-dt * 7));
          if (goal - p < 0.004) p = goal;
          level.setAttribute('transform', 'translate(0 ' + (110 - p * 106).toFixed(2) + ')');
          pct.textContent = Math.round(p * 100) + '%';
          if (p >= 1) setTimeout(split, 200);
          else requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      })();
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
